verus_git_url = "https://github.com/verus-lang/verus.git"
verus_refspec = "main"
verus_extra_args = ["--no-report-long-running"]

# Successes

[[project]]
name = "vstd"
# (the vstd of the Verus being tested: another one need not match its verifier)
use_verus_repo = true
crate_roots = ["source/vstd/vstd.rs"]
extra_verus_args = [
    "--crate-type=lib",
    "--is-vstd",
    "--cfg", "feature=\"std\"",
    "--cfg", "feature=\"alloc\"",
]

