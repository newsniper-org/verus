[package]
name = "air"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Note: do not add any dependencies on rustc -- AIR deliberately abstracts away from rustc's internals
[dependencies]
sise = "0.6.0"
getopts = { git = "https://github.com/utaal/getopts.git", branch = "parse-partial" }
smt-scope = { version = "0.1.7", features = ["analysis"] }
petgraph = "0.6"
serde = { version = "1", features = ["derive", "rc"] }
# Parses the single-line abductive candidate JSON that the adsmt
# backend (`lu-smt`) emits after the literal `abductive` verdict
# label (Y4 smt-cross-validation-tracker §9 schema).
serde_json = "1"
indexmap = { version = "1" }
yansi = "0.5"

[target.'cfg(windows)'.dependencies]
win32job = "1"

[features]
singular = []

# Temporary verus-side guard for the adsmt/lu-smt native `distinct`
# finite-domain SOUNDNESS bug (filed P0 to adsmt 2026-06-12).
#
# lu-smt's native engine models an uninterpreted sort as a fixed,
# ~52-element finite domain, so a `(distinct …)` over MORE than ~52
# fresh constants becomes a spurious UNSAT by pigeonhole.  Verus's
# prelude emits a 56-way `(distinct fuel%… )` over the `FuelId` sort
# (vir/src/context.rs), which therefore makes lu-smt judge the whole
# prelude `F` UNSAT — and every obligation `F ∧ ¬G` is then vacuously
# UNSAT, i.e. EVERYTHING "verifies" (even `ensures false`).
#
# Until lu-smt lands the fix, the air SMT printer (printer.rs) expands
# any `(distinct …)` with more than `distinct_max_arity` operands into
# the semantically-identical pairwise `(and (not (= a b)) …)` form,
# but ONLY for the Adsmt backend (Z3/cvc5/oxiz keep native distinct).
# `build.rs` reads the value below and bakes it in as a compile-time
# env var; edit it here and rebuild to fine-tune.  Set comfortably
# below the engine's empirical 52/53 cliff.  Raise toward Z3 parity
# (or remove the guard) once lu-smt fixes the finite-domain modelling.
[package.metadata.adsmt]
distinct_max_arity = 48

[lints]
workspace = true
